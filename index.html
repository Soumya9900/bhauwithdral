<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sanju Referral System - Web GUI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: linear-gradient(145deg, #12122a, #1a1a3e);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        /* Header */
        .header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
            letter-spacing: 1px;
        }

        .header .subtitle {
            font-size: 14px;
            color: #aaa;
            margin-top: 5px;
        }

        .header .developer {
            color: #ff6bcd;
            font-weight: 600;
            margin-top: 3px;
            font-size: 13px;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .status-item {
            flex: 1;
            min-width: 100px;
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
        }

        .status-item .label {
            font-size: 10px;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 0.5px;
        }

        .status-item .value {
            font-size: 16px;
            font-weight: 700;
            margin-top: 2px;
        }

        .status-item .value.green { color: #4caf50; }
        .status-item .value.gold { color: #ffd700; }
        .status-item .value.blue { color: #42a5f5; }
        .status-item .value.red { color: #ef5350; }
        .status-item .value.purple { color: #ab47bc; }

        /* Form */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #ccc;
            margin-bottom: 5px;
        }

        .form-group label .badge {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            margin-left: 8px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .form-row .form-group {
            flex: 1;
            min-width: 150px;
        }

        select, input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        select:focus, input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
            background: rgba(255, 255, 255, 0.1);
        }

        select option {
            background: #1a1a3e;
            color: #fff;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 140px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: linear-gradient(135deg, #ffd700, #f57c00);
            color: #1a1a2e;
        }

        .btn-primary:hover {
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.3);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef5350, #c62828);
            color: #fff;
        }

        .btn-danger:hover {
            box-shadow: 0 8px 30px rgba(239, 83, 80, 0.3);
            transform: translateY(-2px);
        }

        .btn-success {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: #fff;
        }

        .btn-success:hover {
            box-shadow: 0 8px 30px rgba(76, 175, 80, 0.3);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Console Log */
        .console {
            background: #0a0a1a;
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
        }

        .console .log-line {
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            word-break: break-all;
        }

        .console .log-line .time {
            color: #666;
            margin-right: 10px;
        }

        .console .log-line .msg {
            color: #ccc;
        }

        .console .log-line .msg.green { color: #4caf50; }
        .console .log-line .msg.gold { color: #ffd700; }
        .console .log-line .msg.blue { color: #42a5f5; }
        .console .log-line .msg.red { color: #ef5350; }
        .console .log-line .msg.purple { color: #ab47bc; }
        .console .log-line .msg.cyan { color: #26c6da; }
        .console .log-line .msg.lime { color: #cddc39; }

        .console::-webkit-scrollbar {
            width: 6px;
        }

        .console::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .console::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.3);
            border-radius: 10px;
        }

        .console .clear-log {
            position: sticky;
            top: 0;
            background: #0a0a1a;
            padding: 8px 0;
            display: flex;
            justify-content: flex-end;
            z-index: 10;
        }

        .console .clear-log button {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: #888;
            padding: 4px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
        }

        .console .clear-log button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        /* Progress */
        .progress-container {
            margin-top: 15px;
            display: none;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            border-radius: 10px;
            width: 0%;
            transition: width 0.5s ease;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container { padding: 15px; }
            .header h1 { font-size: 22px; }
            .status-item { min-width: 70px; padding: 5px; }
            .status-item .value { font-size: 14px; }
            .btn { padding: 12px 18px; font-size: 14px; min-width: 100px; }
            .form-row { flex-direction: column; gap: 10px; }
            .console { max-height: 250px; font-size: 11px; }
        }

        /* Toggle Switch */
        .toggle-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #aaa;
            cursor: pointer;
        }

        .toggle-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #ffd700;
            cursor: pointer;
        }

        /* Port Selection Highlight */
        .port-select {
            border-color: rgba(66, 165, 245, 0.3);
        }

        .port-select:focus {
            border-color: #42a5f5;
            box-shadow: 0 0 20px rgba(66, 165, 245, 0.2);
        }

        .port-status {
            font-size: 12px;
            margin-top: 4px;
            color: #888;
        }

        .port-status.connected {
            color: #4caf50;
        }

        .port-status.disconnected {
            color: #ef5350;
        }

        /* Badge Animation */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .pulse {
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 14px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            z-index: 999;
            display: none;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            display: block;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>

        // ============================================================

        let toastTimeout = null;

        function showToast(message, duration = 3000) {
            toastEl.textContent = message;
            toastEl.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastEl.classList.remove('show');

        // ============================================================
        // CONSOLE LOGGING
        // ============================================================
        function log(message, color = '') {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = 'log-line';
            div.innerHTML = `<span class="time">[${time}]</span><span class="msg ${color}">${message}</span>`;
            logContainer.appendChild(div);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            // Keep only last 500 lines
            while (logContainer.children.length > 500) {
                logContainer.removeChild(logContainer.firstChild);
            }
        }

        function clearConsole() {
            logContainer.innerHTML = '';
            log('🗑 Console cleared', 'gold');
        }

        // ============================================================
        // PORT DETECTION (Simulated for Web)
        // ============================================================
        function detectPorts() {
            // In a real web app with WebUSB or WebSerial, we'd use those APIs.
            // For this demo, we simulate with common COM ports.
            const simulatedPorts = [
                'COM1', 'COM2', 'COM3', 'COM4', 'COM5', 'COM6', 'COM7', 'COM8', 'COM9', 'COM10',
                'COM11', 'COM12', 'COM13', 'COM14', 'COM15', 'COM16', 'COM17', 'COM18', 'COM19', 'COM20',
                'COM21', 'COM22', 'COM23', 'COM24', 'COM25', 'COM26', 'COM27', 'COM28', 'COM29', 'COM30',
                'COM31', 'COM32', 'COM33', 'COM34', 'COM35', 'COM36', 'COM37', 'COM38', 'COM39', 'COM40',
                '/dev/ttyUSB0', '/dev/ttyUSB1', '/dev/ttyUSB2', '/dev/ttyS0', '/dev/ttyS1',
                '/dev/ttyACM0', '/dev/ttyACM1', '/dev/ttyAMA0'
            ];

            // Check if WebSerial is available
            if ('serial' in navigator) {
                log('🔍 WebSerial API available - detecting ports...', 'cyan');
                // In a real implementation, we'd use navigator.serial.getPorts()
                // For demo, we'll show a prompt to connect
                showToast('WebSerial available! Click "Connect Serial" in browser prompt.', 4000);
                // Try to request a port
                try {
                    navigator.serial.requestPort().then(port => {
                        const info = port.getInfo();
                        const portName = info.usbVendorId ? `USB-${info.usbVendorId}` : 'Serial Port';
                        addPortOption(portName);
                        log(`✅ Connected to serial port: ${portName}`, 'green');
                        portStatus.textContent = `✅ Connected: ${portName}`;
                        portStatus.className = 'port-status connected';
                        state.selectedPort = portName;
                        showToast(`Connected to ${portName}`, 2000);
                    }).catch(err => {
                        log(`⚠️ Serial port selection cancelled: ${err.message}`, 'yellow');
                    });
                } catch (e) {
                    log(`⚠️ WebSerial request error: ${e.message}`, 'yellow');
                }
            } else {
                log('ℹ️ WebSerial not available. Using simulated ports for demo.', 'blue');
                // Use simulated ports
                simulatedPorts.forEach(p => addPortOption(p));
                // Mark first as default
                if (comPort.options.length > 1) {
                    comPort.selectedIndex = 1;
                    state.selectedPort = comPort.value;
                    portStatus.textContent = `✅ Using: ${state.selectedPort}`;
                    portStatus.className = 'port-status connected';
                    log(`✅ Default port selected: ${state.selectedPort}`, 'green');
                }
            }

            // If no ports found, show a message
            if (comPort.options.length <= 1) {
                addPortOption('COM3 (Default)');
                addPortOption('COM4');
                addPortOption('COM5');
                // Add some more
                simulatedPorts.slice(0, 10).forEach(p => addPortOption(p));
                if (comPort.options.length > 1) {
                    comPort.selectedIndex = 1;
                    state.selectedPort = comPort.value;
                    portStatus.textContent = `✅ Using: ${state.selectedPort}`;
                    portStatus.className = 'port-status connected';
                    log(`✅ Default port selected: ${state.selectedPort}`, 'green');
                }
            }
        }

        function addPortOption(portName) {
            const exists = Array.from(comPort.options).some(opt => opt.value === portName);
            if (!exists) {
                const opt = document.createElement('option');
                opt.value = portName;
                opt.textContent = portName;
                comPort.appendChild(opt);
            }
        }

        // ============================================================
        // AIRPLANE MODE TOGGLE (via WebSerial)
        // ============================================================
        async function toggleAirplaneMode() {
            if (!state.selectedPort) {
                log('❌ No COM port selected!', 'red');
                showToast('Please select a COM port first!', 3000);
                return false;
            }

            log(`✈️ Toggling Airplane Mode on ${state.selectedPort}...`, 'cyan');

            // In a real implementation, this would send AT commands over serial.
            // For demo, we simulate the toggle.
            try {
                // Simulate airplane mode toggle
                log('   📤 Sending AT+CFUN=4 (Airplane ON)...', 'blue');
                await sleep(6000);
                log('   📤 Sending AT+CFUN=1 (Airplane OFF)...', 'blue');
                await sleep(2000);
                
                state.ipRotations++;
                ipCount.textContent = state.ipRotations;
                log(`✅ Airplane Mode toggled successfully (${state.ipRotations} rotations)`, 'green');
                return true;
            } catch (e) {
                log(`❌ Airplane mode toggle failed: ${e.message}`, 'red');
                return false;
            }
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // ============================================================
        // SUNSMS HANDLER (Simulated)
        // ============================================================
        async function getSMSBalance() {
            log('💰 Checking SMS balance...', 'gold');
            // Simulate balance check
            await sleep(1000);
            const balance = (Math.random() * 5 + 1).toFixed(2);
            log(`💰 Balance: $${balance}`, 'green');
            return parseFloat(balance);
        }

        async function getNumber(service) {
            log(`📱 Getting number for ${service}...`, 'cyan');
            await sleep(1500);
            const number = `9${Math.floor(Math.random() * 900000000 + 100000000)}`;
            const requestId = `REQ_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`;
            log(`📱 Number: ${number} (ID: ${requestId})`, 'green');
            return { number, requestId };
        }

        async function getOTP(requestId, maxAttempts = 20, waitTime = 10) {
            log(`🔍 Waiting for OTP (${requestId})...`, 'cyan');
            for (let i = 0; i < maxAttempts; i++) {
                await sleep(waitTime * 1000);
                // Simulate OTP arrival
                if (Math.random() > 0.4) {
                    const otp = String(Math.floor(100000 + Math.random() * 900000));
                    log(`✅ OTP received: ${otp}`, 'green');
                    return otp;
                }
                if (i % 3 === 0) {
                    log(`⏳ Waiting for OTP (${i+1}/${maxAttempts})...`, 'yellow');
                }
            }
            log('❌ OTP timeout', 'red');
            return null;
        }

        async function cancelNumber(requestId) {
            log(`📱 Releasing number (${requestId})...`, 'blue');
            await sleep(500);
            return true;
        }

        // ============================================================
        // API CALLS (Simulated)
        // ============================================================
        async function checkNumberAvailable(phone, game) {
            log(`🔍 Checking number: ${phone} (${game})`, 'cyan');
            await sleep(800 + Math.random() * 500);
            
            // Simulate: 60% chance new, 30% old, 10% blocked
            const rand = Math.random();
            if (rand < 0.6) {
                log(`✅ Number ${phone} is NEW`, 'green');
                return 'NEW';
            } else if (rand < 0.9) {
                log(`❌ Number ${phone} is OLD (already registered)`, 'red');
                return 'OLD';
            } else {
                log(`🚫 Number ${phone} is BLOCKED`, 'red');
                return 'BLOCKED';
            }
        }

        async function sendOTP(phone, game, type = 'signup') {
            log(`📤 Sending ${type} OTP to ${phone}...`, 'cyan');
            await sleep(1200 + Math.random() * 800);
            const success = Math.random() > 0.15;
            if (success) {
                log(`✅ ${type} OTP sent to ${phone}`, 'green');
                return true;
            } else {
                log(`❌ Failed to send ${type} OTP to ${phone}`, 'red');
                return false;
            }
        }

        async function verifyOTP(phone, otp, referralCode, game) {
            log(`🔐 Verifying OTP with referral: ${referralCode || 'DIRECT'}`, 'magenta');
            await sleep(1000 + Math.random() * 1000);
            
            // Simulate verification: 80% success
            if (Math.random() < 0.8) {
                const token = `TOKEN_${Date.now()}_${Math.random().toString(36).substr(2, 12)}`;
                log(`✅✅✅ REGISTRATION SUCCESSFUL!`, 'green');
                return { success: true, token, status: 'SUCCESS' };
            } else {
                const errors = ['Invalid OTP', 'Expired OTP', 'Network error', 'Server error'];
                const error = errors[Math.floor(Math.random() * errors.length)];
                log(`❌ Verification failed: ${error}`, 'red');
                return { success: false, token: null, status: error };
            }
        }

        async function setPassword(phone, token, otp, game) {
            log(`🔑 Setting password for ${phone}...`, 'purple');
            await sleep(1500 + Math.random() * 1500);
            
            // 90% success rate
            if (Math.random() < 0.9) {
                log(`✅✅✅ PASSWORD SET SUCCESSFULLY!`, 'green');
                return { success: true, otp, status: 'PASSWORD_SET_SUCCESS' };
            } else {
                log(`❌ Failed to set password`, 'red');
                return { success: false, otp, status: 'PASSWORD_SET_FAIL' };
            }
        }

        async function getReferralCode(phone, token, game) {
            log(`🔍 Getting referral code...`, 'cyan');
            await sleep(500 + Math.random() * 500);
            const code = `${game.substring(0, 3)}${String(Math.floor(100000 + Math.random() * 900000))}`;
            log(`📌 Referral code: ${code}`, 'gold');
            return code;
        }

        // ============================================================
        // TELEGRAM SEND (Simulated)
        // ============================================================
        async function sendTelegramMessage(message) {
            if (!sendTelegram.checked) {
                log('📤 Telegram disabled by user', 'yellow');
                return true;
            }
            log('📤 Sending to Telegram...', 'lime');
            await sleep(1000);
            log('✅ Message sent to Telegram', 'green');
            return true;
        }

        // ============================================================
        // REGISTRATION PROCESS
        // ============================================================
        async function performRegistration(referralCode, batchAccountNumber, gameConfig) {
            const game = gameConfig.service.toUpperCase();
            
            log(`\n${'='.repeat(50)}`, 'purple');
            log(`📱 ACCOUNT #${batchAccountNumber} - ${game}`, 'purple');
            if (referralCode) {
                log(`🎯 Using Referral: ${referralCode}`, 'gold');
            } else {
                log(`🎯 DIRECT REGISTRATION (No Referral)`, 'gold');
            }
            log(`${'='.repeat(50)}`, 'purple');

            // Step 1: Get number
            const { number, requestId } = await getNumber(gameConfig.service);
            if (!number) {
                log('❌ Failed to get number', 'red');
                return { success: false, error: 'NO_NUMBER' };
            }

            // Step 2: Check if number is available
            const availability = await checkNumberAvailable(number, game);
            if (availability === 'OLD') {
                await cancelNumber(requestId);
                state.skippedAccounts.push(number);
                return { success: false, error: 'OLD_NUMBER' };
            }
            if (availability === 'BLOCKED') {
                await cancelNumber(requestId);
                state.blockedAccounts.push(number);
                return { success: false, error: 'BLOCKED_NUMBER' };
            }

            // Step 3: Send signup OTP
            let otpSent = await sendOTP(number, game, 'signup');
            if (!otpSent) {
                await cancelNumber(requestId);
                return { success: false, error: 'OTP_SEND_FAIL' };
            }

            // Step 4: Get OTP
            const signupOTP = await getOTP(requestId, 15, 8);
            if (!signupOTP) {
                await cancelNumber(requestId);
                return { success: false, error: 'OTP_TIMEOUT' };
            }

            // Step 5: Verify OTP
            const verification = await verifyOTP(number, signupOTP, referralCode, game);
            if (!verification.success || !verification.token) {
                await cancelNumber(requestId);
                return { success: false, error: verification.status };
            }

            log('✅ SIGNUP + REFERRAL SUCCESSFUL!', 'green');

            // Step 6: Set password (BHAU requires 65s wait)
            if (game === 'BHAU') {
                log('⏳ Waiting 65 seconds for BHAU password OTP...', 'yellow');
                for (let i = 65; i > 0; i -= 10) {
                    log(`   ⏳ ${i}s remaining...`, 'yellow');
                    await sleep(10000);
                }
                await sleep(5000);
            }

            let passwordResult = await setPassword(number, verification.token, signupOTP, game);
            
            // Release the number
            await cancelNumber(requestId);

            if (!passwordResult.success) {
                return { success: true, token: verification.token, passwordSet: false, error: passwordResult.status };
            }

            // Step 7: Get new referral code
            const newReferralCode = await getReferralCode(number, verification.token, game);
            
            // Step 8: Save account
            const accountData = {
                accountNumber: state.totalAccounts + 1,
                phone: number,
                referralCode: newReferralCode || 'N/A',
                password: CONFIG.PASSWORD,
                usedReferral: referralCode || 'DIRECT',
                game: game,
                timestamp: new Date().toISOString()
            };
            
            state.totalAccounts++;
            state.referralHistory.push(accountData);
            accountCount.textContent = state.totalAccounts;

            // Step 9: Send to Telegram
            const telegramMsg = `
🎯 NEW REFERRAL SUCCESSFUL!
━━━━━━━━━━━━━━━━━━━━
🎮 Game: ${game}
📊 Account #: ${accountData.accountNumber}
📱 Phone: ${number}
🔑 Password: ${CONFIG.PASSWORD}
📌 New Referral: ${newReferralCode || 'N/A'}
🔗 Used Referral: ${referralCode || 'DIRECT'}
🕐 Time: ${new Date().toLocaleString()}
━━━━━━━━━━━━━━━━━━━━
🤖 Bot: @Sanjuautorefer_bot
👑 Developed by: Sanju
            `;

            const isDirect = !referralCode || referralCode === 'DIRECT';
            await sendTelegramMessage(telegramMsg);

            log(`✅✅✅ ACCOUNT #${batchAccountNumber} COMPLETED!`, 'green');
            if (isDirect) {
                log(`📌 DIRECT registration created referral: ${newReferralCode}`, 'gold');
            }

            return {
                success: true,
                newReferralCode: newReferralCode,
                passwordSet: passwordResult.success,
                token: verification.token,
                phone: number
            };
        }

        // ============================================================
        // MAIN BATCH PROCESS
        // ============================================================
        async function runBatchProcess() {
            if (state.isRunning) return;

            state.isRunning = true;
            state.shouldStop = false;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            botStatus.textContent = '● Running';
            botStatus.className = 'value green pulse';

            const gameKey = state.currentGame;
            const gameConfig = GAMES[gameKey];
            const batchCount = parseInt(perBatch.value) || 2;
            const repeatCount = parseInt(repeats.value) || 1;
            const totalTarget = batchCount * repeatCount;

            CONFIG.PASSWORD = passwordInput.value || 'Sanju2005';

            progressContainer.classList.add('active');
            progressFill.style.width = '0%';
            progressLabel.textContent = `0 / ${totalTarget}`;
            progressPercent.textContent = '0%';

            log(`\n${'█'.repeat(60)}`, 'gold');
            log(`🚀 STARTING ${gameKey} REFERRAL SYSTEM`, 'gold');
            log(`📦 Per Batch: ${batchCount} | 🔄 Repeats: ${repeatCount} | 🎯 Total: ${totalTarget}`, 'cyan');
            log(`🔐 Password: ${CONFIG.PASSWORD}`, 'cyan');
            log(`📌 COM Port: ${state.selectedPort || 'Not selected'}`, 'cyan');
            log(`${'█'.repeat(60)}`, 'gold');

            // Initial IP rotation
            if (autoRotateIP.checked) {
                log('🔄 Rotating IP 1 time at start (1 BAR)...', 'cyan');
                await toggleAirplaneMode();
            }

            let totalSuccessful = 0;
            let totalFailed = 0;
            let totalAttempts = 0;

            for (let batchNum = 1; batchNum <= repeatCount; batchNum++) {
                if (state.shouldStop) {
                    log('⏹️ Process stopped by user', 'red');
                    break;
                }

                log(`\n${'█'.repeat(60)}`, 'gold');
                log(`📦 BATCH ${batchNum}/${repeatCount}`, 'gold');
                log(`   Registrations: ${batchCount}`, 'cyan');
                log(`   Account numbers: #1 to #${batchCount}`, 'cyan');
                log(`${'█'.repeat(60)}`, 'gold');

                let currentReferral = null; // Start with DIRECT
                let batchAborted = false;

                for (let target = 0; target < batchCount; target++) {
                    if (state.shouldStop) {
                        log('⏹️ Process stopped by user', 'red');
                        break;
                    }

                    const batchAccountNumber = target + 1;
                    const isFirstInBatch = (target === 0);
                    const usedReferral = isFirstInBatch ? null : currentReferral;

                    const label = isFirstInBatch ? 'DIRECT' : `Referral: ${currentReferral}`;
                    log(`\n${'='.repeat(50)}`, 'purple');
                    log(`🎯 BATCH ${batchNum} - ACCOUNT #${batchAccountNumber}/${batchCount} - ${label}`, 'purple');
                    log(`${'='.repeat(50)}`, 'purple');

                    totalAttempts++;
                    let retryCount = 0;
                    const maxRetries = 5;
                    let success = false;
                    let newReferral = null;

                    while (retryCount < maxRetries && !success && !state.shouldStop) {
                        retryCount++;
                        
                        if (retryCount > 1 || target > 0 || batchNum > 1) {
                            if (autoRotateIP.checked) {
                                log('🔄 IP Rotation for next registration (1 BAR)...', 'cyan');
                                await toggleAirplaneMode();
                            }
                        }

                        log(`🔄 Attempt ${retryCount}/${maxRetries} for Account #${batchAccountNumber}`, 'cyan');

                        const result = await performRegistration(
                            usedReferral,
                            batchAccountNumber,
                            gameConfig
                        );

                        if (result.success) {
                            success = true;
                            totalSuccessful++;
                            state.totalSuccessful = totalSuccessful;
                            if (result.newReferralCode) {
                                newReferral = result.newReferralCode;
                                currentReferral = newReferral;
                            }
                            log(`✅ Account #${batchAccountNumber} completed!`, 'green');
                            if (isFirstInBatch) {
                                log(`📌 DIRECT created new referral: ${newReferral} (will use for rest of batch)`, 'gold');
                            }
                            break;
                        } else {
                            totalFailed++;
                            state.totalFailed = totalFailed;
                            log(`❌ Account #${batchAccountNumber} failed: ${result.error}`, 'red');
                            
                            if (result.error === 'BLOCKED_NUMBER' || result.error === 'OLD_NUMBER') {
                                break;
                            }
                            
                            if (retryCount < maxRetries) {
                                log(`⏳ Retrying... (${retryCount}/${maxRetries})`, 'yellow');
                                await sleep(5000);
                            }
                        }
                    }

                    // If first account (DIRECT) failed, abort the batch
                    if (!success && isFirstInBatch) {
                        log(`\n❌❌❌ BATCH ${batchNum} ACCOUNT #1 (DIRECT) FAILED!`, 'red');
                        log(`🛑 Skipping remaining accounts in this batch.`, 'red');
                        batchAborted = true;
                        break;
                    }

                    // Update progress
                    const completed = (batchNum - 1) * batchCount + target + 1;
                    const progress = Math.min(100, (completed / totalTarget) * 100);
                    progressFill.style.width = `${progress}%`;
                    progressLabel.textContent = `${completed} / ${totalTarget}`;
                    progressPercent.textContent = `${Math.round(progress)}%`;
                    accountCount.textContent = state.totalAccounts;
                }

                // Batch summary
                log(`\n${'─'.repeat(50)}`, 'cyan');
                log(`📊 BATCH ${batchNum} SUMMARY:`, 'cyan');
                log(`   ✅ Successful: ${totalSuccessful}`, 'green');
                log(`   ❌ Failed: ${totalFailed}`, 'red');
                if (batchAborted) {
                    log(`   🛑 Batch ABORTED due to Account #1 failure`, 'red');
                }
                if (currentReferral) {
                    log(`   📌 Last Referral: ${currentReferral}`, 'gold');
                }
                log(`${'─'.repeat(50)}`, 'cyan');

                // Reset for next batch
                if (batchNum < repeatCount && !state.shouldStop) {
                    log(`\n⏳ Preparing for next batch...`, 'yellow');
                    log(`   🔄 Next batch will start with DIRECT`, 'teal');
                    await sleep(5000);
                    if (autoRotateIP.checked) {
                        log(`🔄 Rotating IP for next batch...`, 'cyan');
                        await toggleAirplaneMode();
                    }
                }
            }

            // Final summary
            log(`\n${'█'.repeat(60)}`, 'gold');
            log(`📊 FINAL SUMMARY - ${gameKey}`, 'gold');
            log(`${'█'.repeat(60)}`, 'gold');
            log(`📦 Registrations per batch: ${batchCount}`, 'cyan');
            log(`🔄 Total repeats: ${repeatCount}`, 'cyan');
            log(`✅ Total Successful: ${totalSuccessful}`, 'green');
            log(`❌ Total Failed: ${totalFailed}`, 'red');
            log(`🔄 Total Attempts: ${totalAttempts}`, 'cyan');
            log(`🚫 Blocked Numbers: ${state.blockedAccounts.length}`, 'red');
            log(`⏭️ Skipped Old Numbers: ${state.skippedAccounts.length}`, 'yellow');
            log(`🔄 IP Rotations: ${state.ipRotations}`, 'purple');
            log(`${'█'.repeat(60)}`, 'gold');

            botStatus.textContent = '● Completed';
            botStatus.className = 'value green';
            showToast('✅ Process completed!', 4000);
            startBtn.disabled = false;
            stopBtn.disabled = true;
            state.isRunning = false;
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        gameSelect.addEventListener('change', function() {
            state.currentGame = this.value;
            gameStatus.textContent = this.value;
            log(`🎮 Game changed to: ${this.value}`, 'gold');
        });

        comPort.addEventListener('change', function() {
            state.selectedPort = this.value;
            if (this.value) {
                portStatus.textContent = `✅ Selected: ${this.value}`;
                portStatus.className = 'port-status connected';
                log(`🔌 COM Port selected: ${this.value}`, 'green');
            } else {
                portStatus.textContent = '⚠️ Please select a COM port';
                portStatus.className = 'port-status disconnected';
            }
        });

        refreshPortsBtn.addEventListener('click', function() {
            log('🔄 Refreshing COM ports...', 'cyan');
            // Clear existing options (keep first)
            while (comPort.options.length > 1) {
                comPort.remove(1);
            }
            detectPorts();
            showToast('Ports refreshed!', 2000);
        });

        startBtn.addEventListener('click', function() {
            if (!state.selectedPort) {
                showToast('⚠️ Please select a COM port first!', 3000);
                log('❌ No COM port selected!', 'red');
                return;
            }
            log('🚀 Starting process...', 'gold');
            runBatchProcess();
        });

        stopBtn.addEventListener('click', function() {
            state.shouldStop = true;
            log('⏹️ Stopping...', 'red');
            showToast('Stopping process...', 2000);
            startBtn.disabled = false;
            stopBtn.disabled = true;
            botStatus.textContent = '● Stopped';
            botStatus.className = 'value red';
        });

        clearLogBtn.addEventListener('click', clearConsole);

        // ============================================================
        // INITIALIZATION
        // ============================================================
        function init() {
            log('🚀 Sanju Refer System Loaded', 'gold');
            log('📱 Web GUI Mode - Select COM port for Airplane Mode', 'blue');
            log('💡 Works on PC and Mobile browsers', 'cyan');
            
            // Detect ports
            setTimeout(detectPorts, 500);
            
            // Set initial game
            state.currentGame = gameSelect.value;
            gameStatus.textContent = gameSelect.value;
            
            // Load saved password if any
            const savedPassword = localStorage.getItem('sanju_password');
            if (savedPassword) {
                passwordInput.value = savedPassword;
            }
            
            // Auto-save password
            passwordInput.addEventListener('change', function() {
                localStorage.setItem('sanju_password', this.value);
                CONFIG.PASSWORD = this.value;
            });

            // Show WebSerial info if available
            if ('serial' in navigator) {
                log('✅ WebSerial API is available!', 'green');
                log('📌 Click "Refresh" to connect to a serial device.', 'blue');
            } else {
                log('ℹ️ WebSerial not available. Using simulated COM ports.', 'yellow');
                log('💡 For real device control, use WebUSB or a backend server.', 'blue');
            }

            // Check if running on mobile
            if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                log('📱 Mobile device detected', 'cyan');
                log('💡 Use USB OTG or Bluetooth serial for COM port access', 'blue');
            }
        }

        // Start the app
        init();

        console.log('Sanju Refer System - Web GUI Loaded');
        console.log('State:', state);
    </script>
