<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>BHau Lotto Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #0b0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            max-width: 520px;
            width: 100%;
            background: #141a2b;
            border-radius: 32px;
            padding: 24px 20px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            color: #eef2f9;
            border: 1px solid #2a3450;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 span {
            background: #2f3b5a;
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            color: #b7c9f2;
        }
        .sub {
            color: #8895bb;
            font-size: 13px;
            margin-bottom: 18px;
            border-left: 3px solid #3b4b75;
            padding-left: 12px;
        }
        .card {
            background: #10182b;
            border-radius: 24px;
            padding: 16px 18px;
            margin-bottom: 14px;
            border: 1px solid #25304a;
        }
        .input-group {
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #a5b3d6;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 13px 16px;
            background: #0f1629;
            border: 1px solid #293753;
            border-radius: 40px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }
        .input-group input:focus {
            border-color: #5a76b0;
            box-shadow: 0 0 0 3px #1e2c4a;
        }
        .flex-row {
            display: flex;
            gap: 10px;
        }
        .flex-row .input-group {
            flex: 1;
        }
        .btn {
            padding: 13px 16px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 15px;
            background: #2a3b6a;
            color: #fff;
            cursor: pointer;
            transition: 0.15s;
            width: 100%;
            text-align: center;
            box-shadow: 0 5px 0 #0f1629;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #0f1629;
        }
        .btn-primary {
            background: #3d5aa0;
        }
        .btn-success {
            background: #1f8b4c;
        }
        .btn-danger {
            background: #b13e4b;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #3c4e78;
            color: #c6d2f0;
            box-shadow: none;
        }
        .btn-outline:active {
            transform: translateY(2px);
        }
        .btn-sm {
            padding: 10px 12px;
            font-size: 13px;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: 0 5px 0 #0f1629 !important;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .badge {
            background: #1f2a47;
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 12px;
            color: #b3c2e6;
            display: inline-block;
        }
        .balance-box {
            background: #0d1529;
            border-radius: 60px;
            padding: 6px 18px;
            display: inline-block;
            border: 1px solid #2e3d62;
            font-weight: 600;
            margin-left: 6px;
            color: #7dffb3;
        }
        .bank-list {
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
            border-top: 1px solid #1d2740;
            padding-top: 10px;
        }
        .bank-item {
            background: #0c1427;
            border-radius: 16px;
            padding: 11px 14px;
            margin-bottom: 7px;
            border-left: 4px solid #3d5aa0;
            font-size: 14px;
        }
        .bank-item .label {
            color: #8895bb;
            font-size: 12px;
        }
        .mt-2 {
            margin-top: 12px;
        }
        .mt-3 {
            margin-top: 18px;
        }
        .text-center {
            text-align: center;
        }
        .text-muted {
            color: #8895bb;
            font-size: 13px;
        }
        .hidden {
            display: none !important;
        }
        .toast {
            background: #1b2542;
            border-radius: 40px;
            padding: 11px 16px;
            margin-top: 10px;
            border-left: 4px solid #5a76b0;
            font-size: 14px;
        }
        .toast.error {
            border-left-color: #c04a5a;
            background: #231b2b;
        }
        .toast.success {
            border-left-color: #3aad6a;
        }
        .toast.info {
            border-left-color: #5a76b0;
        }
        .footer {
            font-size: 11px;
            color: #4a5a7a;
            text-align: center;
            margin-top: 16px;
        }
        #infoContent {
            min-height: 60px;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .status-dot.online {
            background: #3aad6a;
            animation: pulse 1.5s infinite;
        }
        .status-dot.offline {
            background: #c04a5a;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .logged-in-user {
            background: #0f1f2f;
            padding: 8px 14px;
            border-radius: 40px;
            border: 1px solid #1a3a4a;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .logged-in-user .phone {
            font-weight: 600;
            color: #7dffb3;
        }
    </style>
</head>
<body>
    <div class="container" id="app">

        <div class="header">
            <h1>🎯 BHAU <span>LOTTO</span></h1>
            <span class="badge">v2.1</span>
        </div>
        <div class="sub">🔑 Default pass: Sanju2005 • Login • Cards • Withdraw</div>

        <!-- Login Card -->
        <div class="card">
            <div class="input-group">
                <label>📱 Phone (10 digits)</label>
                <input type="tel" id="phoneInput" placeholder="9876543210" maxlength="10" inputmode="numeric" />
            </div>
            <button class="btn btn-primary" id="loginBtn">🔑 Login (auto password)</button>
            <div id="loginStatus" class="toast hidden"></div>
        </div>

        <!-- Action Buttons -->
        <div class="grid-2">
            <button class="btn btn-outline btn-sm" id="balanceBtn">💰 Balance</button>
            <button class="btn btn-outline btn-sm" id="cardsBtn">🏦 Cards</button>
            <button class="btn btn-outline btn-sm" id="addCardBtn">➕ Add Card</button>
            <button class="btn btn-outline btn-sm" id="withdrawBtn">💸 Withdraw</button>
        </div>

        <!-- Info Panel -->
        <div class="card mt-2" style="background:#0e162a;">
            <div id="infoContent">
                <span class="text-muted">👋 Login to see account details</span>
            </div>
        </div>

        <!-- Add Card Form -->
        <div id="addCardForm" class="card hidden" style="background:#111b30;">
            <div class="input-group"><label>👤 Full Name</label><input id="cardName" placeholder="Ananya Sharma" /></div>
            <div class="input-group"><label>💳 Account Number</label><input id="cardNumber" placeholder="1234567890" /></div>
            <div class="input-group"><label>🏛️ IFSC</label><input id="ifscCode" placeholder="MAHB0002009" value="MAHB0002009" /></div>
            <div class="input-group"><label>📧 Email (optional)</label><input id="cardEmail" placeholder="ananya@gmail.com" /></div>
            <div class="flex-row">
                <button class="btn btn-success btn-sm" id="submitCardBtn">✅ Add Card</button>
                <button class="btn btn-outline btn-sm" id="cancelAddCard">Cancel</button>
            </div>
            <div id="addCardStatus" class="toast hidden mt-2"></div>
        </div>

        <!-- Withdraw Form -->
        <div id="withdrawForm" class="card hidden" style="background:#111b30;">
            <div class="input-group"><label>💰 Amount</label><input type="number" id="withdrawAmount" placeholder="100" min="1" /></div>
            <div class="flex-row">
                <button class="btn btn-danger btn-sm" id="submitWithdrawBtn">💸 Withdraw</button>
                <button class="btn btn-outline btn-sm" id="cancelWithdraw">Cancel</button>
            </div>
            <div id="withdrawStatus" class="toast hidden mt-2"></div>
        </div>

        <div class="footer">BHau Lotto Tool • GitHub Pages</div>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── STATE ──────────────────────────────────────────
            const state = {
                token: null,
                phone: null,
                bankCards: [],
                balance: null,
                userData: null,
                isLoggedIn: false
            };

            // ─── DOM refs ──────────────────────────────────────
            const $ = id => document.getElementById(id);
            const phoneInput = $('phoneInput');
            const loginBtn = $('loginBtn');
            const loginStatus = $('loginStatus');
            const balanceBtn = $('balanceBtn');
            const cardsBtn = $('cardsBtn');
            const addCardBtn = $('addCardBtn');
            const withdrawBtn = $('withdrawBtn');
            const infoContent = $('infoContent');
            const addCardForm = $('addCardForm');
            const cardName = $('cardName');
            const cardNumber = $('cardNumber');
            const ifscCode = $('ifscCode');
            const cardEmail = $('cardEmail');
            const submitCardBtn = $('submitCardBtn');
            const cancelAddCard = $('cancelAddCard');
            const addCardStatus = $('addCardStatus');
            const withdrawForm = $('withdrawForm');
            const withdrawAmount = $('withdrawAmount');
            const submitWithdrawBtn = $('submitWithdrawBtn');
            const cancelWithdraw = $('cancelWithdraw');
            const withdrawStatus = $('withdrawStatus');

            // ─── BHau API Config ──────────────────────────────
            function getConfig() {
                return {
                    base: 'https://api.bh2255.xyz',
                    pay: 'https://api.bh556677ww.com',
                    card: 'https://api.bh2266.xyz',
                    packageId: 2,
                    packageInfo: 'com.resulta.checka',
                    channelId: 'Samsung',
                    origin: 'https://playbhau.com',
                    referer: 'https://playbhau.com/'
                };
            }

            function getDeviceId() {
                let id = localStorage.getItem('bhau_device_id');
                if (!id) {
                    id = 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16));
                    localStorage.setItem('bhau_device_id', id);
                }
                return id;
            }

            function getVisitor() {
                return 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16));
            }

            function getReqDate() { return Date.now(); }

            // ─── Toast Helper ──────────────────────────────────
            function showToast(el, msg, type) {
                el.classList.remove('hidden', 'error', 'success', 'info');
                el.textContent = msg;
                if (type) el.classList.add(type);
                else el.classList.add('info');
                clearTimeout(el._toastTimer);
                el._toastTimer = setTimeout(() => el.classList.add('hidden'), 5000);
            }

            // ─── API Calls ─────────────────────────────────────
            async function apiLogin(phone, password) {
                password = password || 'Sanju2005';
                const cfg = getConfig();
                const deviceId = getDeviceId();
                const visitor = getVisitor();
                const reqDate = getReqDate();
                const payload = {
                    userPhone: phone,
                    password: password,
                    deviceCode: deviceId,
                    distinctId: deviceId,
                    channel: 'h5',
                    channelId: cfg.channelId,
                    lang: 'en_US',
                    platform: 'h5',
                    packageId: cfg.packageId,
                    packageInfo: cfg.packageInfo,
                    versionCode: '999',
                    deviceBrand: 'Android',
                    deviceModel: 'Unknown',
                    visitor: visitor,
                    reqDate: reqDate,
                    ua: 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36'
                };
                try {
                    const resp = await fetch(cfg.base + '/app/password/login', {
                        method: 'POST',
                        headers: {
                            'accept': 'application/json, text/plain, */*',
                            'content-type': 'application/json',
                            'origin': cfg.origin,
                            'referer': cfg.referer,
                            'x-device-id': deviceId,
                            'user-agent': 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36'
                        },
                        body: JSON.stringify(payload)
                    });
                    const data = await resp.json();
                    console.log('Login Response:', data);
                    
                    if (resp.status === 200 && (data.code === 0 || data.success === true)) {
                        const ud = data.data || {};
                        const token = ud.accessToken || ud.token || data.accessToken || data.token;
                        
                        if (token) {
                            state.token = token;
                            state.phone = phone;
                            state.userData = ud;
                            state.isLoggedIn = true;
                            
                            // Save to localStorage
                            localStorage.setItem('bhau_token', token);
                            localStorage.setItem('bhau_phone', phone);
                            localStorage.setItem('bhau_logged_in', 'true');
                            
                            return { success: true, token: token, data: ud };
                        } else {
                            return { success: false, msg: 'Token not found in response' };
                        }
                    } else {
                        return { success: false, msg: data.msg || 'Login failed' };
                    }
                } catch (e) {
                    console.error('Login error:', e);
                    return { success: false, msg: e.message || 'Network error' };
                }
            }

            async function apiGetBalance() {
                if (!state.token) return { success: false, msg: 'Not logged in' };
                const cfg = getConfig();
                const visitor = getVisitor();
                const reqDate = getReqDate();
                const payload = {
                    channel: 'h5',
                    channelId: cfg.channelId,
                    lang: 'en_US',
                    packageId: cfg.packageId,
                    packageInfo: cfg.packageInfo,
                    versionCode: '999',
                    visitor: visitor,
                    reqDate: reqDate,
                    ua: 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36'
                };
                const endpoints = [
                    cfg.base + '/app/user/getBalanceV2?gameType=POST',
                    cfg.base + '/app/user/info',
                    cfg.base + '/app/user/getBalance'
                ];
                for (const url of endpoints) {
                    try {
                        const resp = await fetch(url, {
                            method: 'POST',
                            headers: {
                                'accept': 'application/json',
                                'content-type': 'application/json',
                                'token': state.token,
                                'origin': cfg.origin,
                                'referer': cfg.referer
                            },
                            body: JSON.stringify(payload)
                        });
                        if (resp.status === 200) {
                            const data = await resp.json();
                            console.log('Balance Response:', data);
                            if (data.code === 0) {
                                const ud = data.data || {};
                                const balance = ud.balance ?? ud.coin ?? ud.coins ?? ud.amount ?? ud.credit ?? ud.totalBalance ?? null;
                                if (balance !== null && balance !== undefined) {
                                    state.balance = balance;
                                    return { success: true, balance: balance };
                                }
                            }
                        }
                    } catch (_) { /* ignore */ }
                }
                return { success: false, msg: 'Balance not found' };
            }

            async function apiGetCards() {
                if (!state.token) return { success: false, msg: 'Not logged in' };
                const cfg = getConfig();
                const visitor = getVisitor();
                const reqDate = getReqDate();
                const payload = {
                    channel: 'h5',
                    channelId: cfg.channelId,
                    lang: 'en_US',
                    packageId: cfg.packageId,
                    packageInfo: cfg.packageInfo,
                    reqDate: reqDate,
                    ua: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                    versionCode: '999',
                    visitor: visitor
                };
                const endpoints = [
                    'https://api.bh556677wplus.com/app/card/info',
                    cfg.card + '/app/card/list',
                    cfg.pay + '/app/card/info',
                    cfg.card + '/app/card/info'
                ];
                for (const url of endpoints) {
                    try {
                        const resp = await fetch(url, {
                            method: 'POST',
                            headers: {
                                'accept': 'application/json',
                                'content-type': 'application/json',
                                'token': state.token,
                                'packageid': String(cfg.packageId),
                                'origin': cfg.origin,
                                'referer': cfg.referer
                            },
                            body: JSON.stringify(payload)
                        });
                        if (resp.status === 200) {
                            const data = await resp.json();
                            console.log('Cards Response:', data);
                            if (data.code === 0) {
                                let cards = data.data;
                                if (Array.isArray(cards) && cards.length > 0) {
                                    state.bankCards = cards;
                                    return { success: true, cards: cards };
                                } else if (typeof cards === 'object' && cards !== null) {
                                    for (const key of ['list', 'cards', 'cardList']) {
                                        if (Array.isArray(cards[key]) && cards[key].length > 0) {
                                            state.bankCards = cards[key];
                                            return { success: true, cards: cards[key] };
                                        }
                                    }
                                    if (cards.id || cards.cardId) {
                                        state.bankCards = [cards];
                                        return { success: true, cards: [cards] };
                                    }
                                }
                            }
                        }
                    } catch (_) { /* ignore */ }
                }
                return { success: false, msg: 'No cards found' };
            }

            async function apiAddCard(name, number, ifsc, email) {
                if (!state.token) return { success: false, msg: 'Not logged in' };
                const cfg = getConfig();
                const visitor = getVisitor();
                const reqDate = getReqDate();
                const url = cfg.pay + '/app/card/add';
                const payload = {
                    channel: 'h5',
                    channelId: cfg.channelId,
                    lang: 'en_US',
                    visitor: visitor,
                    cardName: name,
                    cardNumber: number,
                    email: email || '',
                    ifsCode: ifsc,
                    packageId: cfg.packageId,
                    packageInfo: cfg.packageInfo,
                    reqDate: reqDate,
                    smsCode: '',
                    ua: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                    upid: '',
                    versionCode: '999'
                };
                const headers = {
                    'accept': 'application/json',
                    'content-type': 'application/json',
                    'token': state.token,
                    'packageid': String(cfg.packageId),
                    'origin': cfg.origin,
                    'referer': cfg.referer
                };
                try {
                    const resp = await fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(payload) });
                    const data = await resp.json();
                    console.log('Add Card Response:', data);
                    if (resp.status === 200 && (data.code === 0 || data.success === true)) {
                        return { success: true };
                    } else {
                        return { success: false, msg: data.msg || 'Add card failed' };
                    }
                } catch (e) {
                    return { success: false, msg: e.message };
                }
            }

            async function apiWithdraw(amount, cardId) {
                if (!state.token) return { success: false, msg: 'Not logged in' };
                const cfg = getConfig();
                const visitor = getVisitor();
                const reqDate = getReqDate();
                const payload = {
                    cardId: String(cardId),
                    channel: 'h5',
                    channelId: cfg.channelId,
                    lang: 'en_US',
                    packageId: cfg.packageId,
                    packageInfo: cfg.packageInfo,
                    price: Number(amount),
                    reqDate: reqDate,
                    ua: 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36',
                    versionCode: '999',
                    visitor: visitor
                };
                try {
                    const resp = await fetch(cfg.pay + '/app/pay/paid', {
                        method: 'POST',
                        headers: {
                            'accept': 'application/json',
                            'content-type': 'application/json',
                            'token': state.token,
                            'origin': cfg.origin,
                            'referer': cfg.referer
                        },
                        body: JSON.stringify(payload)
                    });
                    const data = await resp.json();
                    console.log('Withdraw Response:', data);
                    if (resp.status === 200 && (data.code === 0 || data.success === true)) {
                        return { success: true };
                    } else {
                        return { success: false, msg: data.msg || 'Withdraw failed' };
                    }
                } catch (e) {
                    return { success: false, msg: e.message };
                }
            }

            // ─── UI Render ─────────────────────────────────────
            function renderInfo() {
                console.log('Rendering info. isLoggedIn:', state.isLoggedIn, 'token:', state.token);
                
                if (!state.isLoggedIn || !state.token) {
                    infoContent.innerHTML = `
                        <span class="text-muted">🔒 Not logged in</span>
                        <div style="margin-top:8px;font-size:12px;color:#4a5a7a;">
                            <span class="status-dot offline"></span> Disconnected
                        </div>
                    `;
                    return;
                }
                
                let html = '<div class="logged-in-user">';
                html += '<span class="status-dot online"></span>';
                html += '<span class="phone">📱 ' + (state.phone || '---') + '</span>';
                html += '</div>';
                
                html += '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px;">';
                if (state.balance !== null) {
                    html += ' <span class="balance-box">💰 Balance: ' + state.balance + '</span>';
                } else {
                    html += ' <span class="badge" style="background:#2a1f3a;">⏳ Loading balance...</span>';
                }
                html += '</div>';
                
                if (state.bankCards && state.bankCards.length) {
                    html += '<div class="bank-list">';
                    state.bankCards.forEach(function(c, index) {
                        var id = c.id || c.cardId || c.card_id || '?';
                        var holder = c.accountName || c.holderName || c.name || 'Unknown';
                        var bank = c.bankName || c.bank || '';
                        var acc = c.accountNumber || c.cardNumber || c.cardNo || '';
                        var masked = acc && acc.length > 6 ? acc.slice(0, 4) + '****' + acc.slice(-4) : acc;
                        html += '<div class="bank-item">';
                        html += '<div><strong>#' + (index + 1) + ' ' + holder + '</strong>' + (bank ? ' • ' + bank : '') + '</div>';
                        html += '<div class="text-muted" style="font-size:12px;">' + masked +
                            ' • IFSC: ' + (c.ifscCode || c.ifsCode || '---') +
                            ' • ID: ' + id + '</div>';
                        html += '</div>';
                    });
                    html += '</div>';
                } else {
                    html += '<div class="text-muted" style="margin-top:10px;">💳 No bank cards added yet</div>';
                }
                infoContent.innerHTML = html;
            }

            function refreshAll() {
                if (state.isLoggedIn && state.token) {
                    infoContent.innerHTML = '<span class="text-muted">⏳ Loading account data...</span>';
                    
                    apiGetBalance().then(function(r) {
                        if (r.success) state.balance = r.balance;
                        renderInfo();
                    }).catch(function() {
                        renderInfo();
                    });
                    
                    apiGetCards().then(function(r) {
                        if (r.success) state.bankCards = r.cards;
                        renderInfo();
                    }).catch(function() {
                        renderInfo();
                    });
                } else {
                    renderInfo();
                }
            }

            // ─── Event Handlers ──────────────────────────────
            async function handleLogin() {
                var phone = phoneInput.value.trim().replace(/\D/g, '');
                if (phone.length !== 10) {
                    showToast(loginStatus, '❌ Enter 10-digit phone number', 'error');
                    return;
                }
                loginStatus.classList.add('hidden');
                loginBtn.textContent = '⏳ Logging in...';
                loginBtn.disabled = true;
                
                var result = await apiLogin(phone);
                
                loginBtn.textContent = '🔑 Login (auto password)';
                loginBtn.disabled = false;
                
                if (result.success) {
                    showToast(loginStatus, '✅ Login successful!', 'success');
                    console.log('Login success. State:', state);
                    refreshAll();
                } else {
                    showToast(loginStatus, '❌ ' + (result.msg || 'Login failed'), 'error');
                }
            }

            function showAddCard() {
                if (!state.isLoggedIn || !state.token) {
                    showToast(loginStatus, '⚠️ Please login first', 'error');
                    return;
                }
                addCardForm.classList.remove('hidden');
                withdrawForm.classList.add('hidden');
                var names = ['Ananya', 'Aadhya', 'Ishita', 'Aanya', 'Advika', 'Charvi', 'Diya', 'Anvi', 'Aarohi', 'Sara',
                    'Riya', 'Naira', 'Pari', 'Tara', 'Ira', 'Vanya', 'Myra', 'Kavya', 'Priya', 'Neha'
                ];
                var last = ['Sharma', 'Verma', 'Patel', 'Kumar', 'Singh', 'Gupta', 'Yadav', 'Joshi', 'Malhotra', 'Mehta'];
                var f = names[Math.floor(Math.random() * names.length)];
                var l = last[Math.floor(Math.random() * last.length)];
                cardName.value = f + ' ' + l;
                cardEmail.value = f.toLowerCase() + l.toLowerCase() + '@gmail.com';
                ifscCode.value = 'MAHB0002009';
                cardNumber.value = '';
                addCardStatus.classList.add('hidden');
            }

            async function handleAddCard() {
                var name = cardName.value.trim();
                var number = cardNumber.value.trim().replace(/\s/g, '');
                var ifsc = ifscCode.value.trim().toUpperCase();
                var email = cardEmail.value.trim();
                if (!name || !number || !ifsc) {
                    showToast(addCardStatus, '❌ Name, Account, IFSC required', 'error');
                    return;
                }
                submitCardBtn.textContent = '⏳ Adding...';
                submitCardBtn.disabled = true;
                
                var result = await apiAddCard(name, number, ifsc, email);
                
                submitCardBtn.textContent = '✅ Add Card';
                submitCardBtn.disabled = false;
                
                if (result.success) {
                    showToast(addCardStatus, '✅ Card added successfully!', 'success');
                    setTimeout(function() {
                        addCardForm.classList.add('hidden');
                        refreshAll();
                    }, 1000);
                } else {
                    showToast(addCardStatus, '❌ ' + (result.msg || 'Failed to add card'), 'error');
                }
            }

            function showWithdraw() {
                if (!state.isLoggedIn || !state.token) {
                    showToast(loginStatus, '⚠️ Please login first', 'error');
                    return;
                }
                if (!state.bankCards || state.bankCards.length === 0) {
                    showToast(loginStatus, '⚠️ No bank cards found. Please add one first.', 'error');
                    return;
                }
                withdrawForm.classList.remove('hidden');
                addCardForm.classList.add('hidden');
                withdrawAmount.value = '';
                withdrawStatus.classList.add('hidden');
            }

            async function handleWithdraw() {
                var amt = parseInt(withdrawAmount.value.trim());
                if (!amt || amt <= 0) {
                    showToast(withdrawStatus, '❌ Enter a valid amount', 'error');
                    return;
                }
                var card = state.bankCards[0];
                var cardId = card.id || card.cardId || card.card_id;
                if (!cardId) {
                    showToast(withdrawStatus, '❌ Card ID missing', 'error');
                    return;
                }
                
                var bal = await apiGetBalance();
                if (bal.success && bal.balance < amt) {
                    showToast(withdrawStatus, '❌ Insufficient balance: ' + bal.balance, 'error');
                    return;
                }
                
                submitWithdrawBtn.textContent = '⏳ Processing...';
                submitWithdrawBtn.disabled = true;
                
                var result = await apiWithdraw(amt, cardId);
                
                submitWithdrawBtn.textContent = '💸 Withdraw';
                submitWithdrawBtn.disabled = false;
                
                if (result.success) {
                    showToast(withdrawStatus, '✅ Withdrawal of ' + amt + ' successful!', 'success');
                    setTimeout(function() {
                        withdrawForm.classList.add('hidden');
                        refreshAll();
                    }, 1500);
                } else {
                    showToast(withdrawStatus, '❌ ' + (result.msg || 'Withdrawal failed'), 'error');
                }
            }

            // ─── Auto-restore Session ─────────────────────────
            function restoreSession() {
                const savedToken = localStorage.getItem('bhau_token');
                const savedPhone = localStorage.getItem('bhau_phone');
                const savedLoggedIn = localStorage.getItem('bhau_logged_in');
                
                console.log('Restoring session:', { savedToken, savedPhone, savedLoggedIn });
                
                if (savedToken && savedPhone && savedLoggedIn === 'true') {
                    state.token = savedToken;
                    state.phone = savedPhone;
                    state.isLoggedIn = true;
                    phoneInput.value = savedPhone;
                    console.log('Session restored. State:', state);
                    refreshAll();
                    return true;
                }
                return false;
            }

            // ─── Force refresh button ─────────────────────────
            function addDebugButtons() {
                // Add a hidden refresh button for debugging
                const refreshBtn = document.createElement('button');
                refreshBtn.textContent = '🔄 Refresh';
                refreshBtn.style.cssText = 'position:fixed;bottom:10px;right:10px;background:#1a2a3a;color:#8895bb;border:1px solid #2a3a5a;border-radius:20px;padding:5px 12px;font-size:10px;cursor:pointer;z-index:999;opacity:0.3;';
                refreshBtn.onclick = function() {
                    console.log('Manual refresh. State:', state);
                    refreshAll();
                };
                document.body.appendChild(refreshBtn);
            }

            // ─── Init ──────────────────────────────────────────
            function init() {
                loginBtn.addEventListener('click', handleLogin);
                balanceBtn.addEventListener('click', function() {
                    if (state.isLoggedIn && state.token) {
                        apiGetBalance().then(function() { renderInfo(); });
                    } else {
                        showToast(loginStatus, '⚠️ Please login first', 'error');
                    }
                });
                cardsBtn.addEventListener('click', function() {
                    if (state.isLoggedIn && state.token) {
                        apiGetCards().then(function() { renderInfo(); });
                    } else {
                        showToast(loginStatus, '⚠️ Please login first', 'error');
                    }
                });
                addCardBtn.addEventListener('click', showAddCard);
                cancelAddCard.addEventListener('click', function() { addCardForm.classList.add('hidden'); });
                submitCardBtn.addEventListener('click', handleAddCard);
                withdrawBtn.addEventListener('click', showWithdraw);
                cancelWithdraw.addEventListener('click', function() { withdrawForm.classList.add('hidden'); });
                submitWithdrawBtn.addEventListener('click', handleWithdraw);

                phoneInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') handleLogin();
                });

                // Try to restore session
                const restored = restoreSession();
                if (!restored) {
                    renderInfo();
                }

                addDebugButtons();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
